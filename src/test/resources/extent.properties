# Enable Spark HTML reporting.
extent.reporter.spark.start=true

# Report file name generated inside the timestamped folder.
extent.reporter.spark.out=ExtentReport.html

# Creates a unique report folder for every execution.
basefolder.name=target/extent-reports
basefolder.datetimepattern=d-MMM-YY HH-mm-ss

# Execution metadata displayed in the Extent Report dashboard.
systeminfo.Project=Hotel Booking API Automation Framework
systeminfo.Tester=Shubha
systeminfo.Environment=QA
systeminfo.Framework=Rest Assured + Cucumber + JUnit5
systeminfo.Language=Java